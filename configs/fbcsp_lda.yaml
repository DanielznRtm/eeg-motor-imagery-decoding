# Filter Bank CSP + LDA (after Ang et al., 2012).
# Run: python -m src.train --config configs/fbcsp_lda.yaml
name: fbcsp_lda
seed: 42

data:
  # 9 bands of 4 Hz from 4 to 40 Hz, each applied to the continuous signal.
  bands: [[4, 8], [8, 12], [12, 16], [16, 20], [20, 24], [24, 28], [28, 32], [32, 36], [36, 40]]
  tmin: 0.5
  tmax: 2.5
  resample: null

model:
  type: fbcsp_lda
  multiclass: ovr
  reg: ledoit_wolf
  n_components: 4          # per class and band: 9 bands x 4 classes x 4 = 144 features
  k_features: 16           # kept by mutual-information selection

search:                    # chosen by stratified 5-fold CV on session 1 only
  cv_folds: 5
  n_jobs: 1               # serial: deterministic, avoids Windows process-pool issues
  param_grid:
    fbcsp__csp__n_components: [2, 4]
    select__k: [8, 16, 32, 64]
